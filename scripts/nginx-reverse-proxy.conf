# totalk.ai —— Next.js 应用反向代理配置
#
# 使用方式（宝塔面板）：
#   网站 → 点击 totalk.ai → 配置文件
#   用下面的 location / 块替换原有的 location / 段
#   保存后宝塔会自动重载 Nginx
#
# 说明：本应用自带静态资源处理，不需要宝塔额外配置静态文件规则。
# 站点根目录（默认 /www/wwwroot/totalk.ai）不会被实际使用，保留即可。

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # 传递真实请求信息。Next.js 依赖 X-Forwarded-Proto 判断是否为 https，
    # 缺失会导致生成的链接为 http，或在登录跳转时出现问题。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # WebSocket 升级头（RSC 与热更新需要）
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 关闭缓冲，避免流式响应（RSC）被缓存后一次性输出
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
